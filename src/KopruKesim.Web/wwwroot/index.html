<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Köprü kesim ölçüm tablası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --zemin: #d9dfe0;        /* atolye betonu */
    --emaye: #f6f8f8;        /* makine govdesi beyazi */
    --murekkep: #14232b;
    --soluk: #55666f;
    --cizgi: #b9c3c6;
    --yesil: #147a43;        /* makine yesili: eylemler */
    --yesil-koyu: #0e5c32;
    --serit: #f4c20d;        /* serit metre sarisi: olculer */
    --uyari: #b3380b;
    --govde: "Barlow", "Segoe UI", system-ui, sans-serif;
    --baslik: "Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--zemin); color: var(--murekkep);
    font: 400 16px/1.45 var(--govde);
    display: grid; grid-template-rows: auto 1fr; min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--serit); outline-offset: 2px; }

  /* Ust serit */
  .ust {
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
    padding: 14px 24px 12px; background: var(--murekkep); color: var(--emaye);
  }
  .ust h1 { margin: 0; font: 600 28px/1 var(--baslik); letter-spacing: .01em; }
  .ust p { margin: 0; color: #a9b8be; font-size: 15px; }
  .ust .durum { margin-left: auto; font-size: 15px; color: #cfd9dc; }
  .ust .durum b { color: var(--serit); font-weight: 600; }

  .duzen {
    display: grid; min-height: 0;
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "sahne kontrol" "sahne sonuclar";
  }
  .kontrol { grid-area: kontrol; background: var(--emaye); border-left: 1px solid var(--cizgi); padding: 16px 20px 6px; }
  .sonuclar { grid-area: sonuclar; background: var(--emaye); border-left: 1px solid var(--cizgi); overflow-y: auto; }
  .sahne { grid-area: sahne; }
  .modlar { display: flex; margin-bottom: 8px; }
  .modlar label { flex: 1; }
  .modlar input { position: absolute; opacity: 0; pointer-events: none; }
  .modlar span {
    display: block; text-align: center; padding: 9px 4px; cursor: pointer; border: 1px solid var(--cizgi); border-left-width: 0;
    background: #fff; font: 600 17px/1.1 var(--baslik);
  }
  .modlar label:first-child span { border-left-width: 1px; border-radius: 4px 0 0 4px; }
  .modlar label:last-child span { border-radius: 0 4px 4px 0; }
  .modlar input:checked + span { background: var(--murekkep); color: var(--serit); border-color: var(--murekkep); }
  .modlar input:focus-visible + span { outline: 3px solid var(--serit); outline-offset: 2px; position: relative; }
  .mod-aciklama { margin: 0 0 12px; color: var(--soluk); font-size: 14px; }
  .grup { padding: 12px 0 14px; border-top: 1px solid var(--cizgi); }
  .grup h2 { margin: 0 0 8px; font: 600 21px/1.1 var(--baslik); }
  .grup .satir { margin-bottom: 8px; }
  .grup .onay { margin: 8px 0 0; }
  .ana-dugmeler { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .ana-dugmeler #olcDugme { grid-column: 1 / -1; }
  .dugme.buyuk { padding: 13px 14px; font-size: 17px; }
  .canli-ayar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .canli-ayar .onay { margin: 4px 0; }
  .baglanti { border: 0; background: none; padding: 6px 0 0; color: var(--yesil-koyu); text-decoration: underline; cursor: pointer; font-size: 14.5px; }
  [data-mod][hidden] { display: none !important; }

  /* Sahne */
  .sahne { padding: 20px 24px 24px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .sekmeler { display: flex; gap: 4px; }
  .sekme {
    border: 0; background: transparent; padding: 8px 14px; cursor: pointer;
    font: 600 19px/1 var(--baslik); color: var(--soluk); border-bottom: 3px solid transparent;
  }
  .sekme[aria-selected="true"] { color: var(--murekkep); border-bottom-color: var(--yesil); }
  .sekme:disabled { opacity: .4; cursor: default; }
  .tuval {
    flex: 1; min-height: 320px; background: var(--emaye); border: 1px solid var(--cizgi);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .tuval svg { width: 100%; height: 100%; display: block; max-height: calc(100vh - 170px); }
  .bos {
    max-width: 44ch; padding: 32px; text-align: left;
  }
  .bos h2 { font: 600 30px/1.1 var(--baslik); margin: 0 0 10px; }
  .bos p { margin: 0 0 18px; color: var(--soluk); }
  .ipucu { margin: 0; font-size: 14px; color: var(--soluk); }

  /* Kamera gorunumu */
  .kose { cursor: grab; }
  .kose:active { cursor: grabbing; }
  .kose circle { fill: var(--serit); stroke: var(--murekkep); }
  .cerceve { fill: rgba(244, 194, 13, .10); stroke: var(--serit); }
  .eksen-yazi { font-family: var(--baslik); font-weight: 700; fill: var(--serit); paint-order: stroke; stroke: var(--murekkep); }

  /* Ustten olcum */
  .cetvel line { stroke: var(--murekkep); }
  .cetvel text { font-family: var(--baslik); font-weight: 500; fill: var(--murekkep); }
  .parca-cizgi { fill: rgba(244, 194, 13, .08); stroke: var(--serit); stroke-linejoin: round; paint-order: stroke; }
  .parca-golge { fill: none; stroke: var(--murekkep); stroke-linejoin: round; }
  .nesne-cizgi { fill: rgba(20, 35, 43, .12); stroke: var(--emaye); stroke-linejoin: round; }
  .uyari { margin: 16px 22px 0; padding: 12px 14px; border-left: 4px solid var(--uyari); background: #fbeee8; color: #6d2206; }
  .uyari h3 { margin: 0 0 4px; font: 600 20px/1.15 var(--baslik); }
  .uyari p { margin: 0; font-size: 14.5px; }
  .isaret-kutu { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--cizgi); }
  .isaret-kutu h3 { margin: 0 0 2px; font: 600 19px/1.15 var(--baslik); }
  .isaret-kutu p { margin: 0 0 8px; font-size: 14.5px; }
  .isaret-kutu p.acik { color: var(--yesil-koyu); font-weight: 600; }
  .ipucu-kucuk { color: var(--soluk); font-size: 13.5px !important; }
  .isaret-bilgi { margin: 0 0 10px; color: var(--soluk); font-size: 14.5px; }
  .yontem { font: 500 14px/1 var(--govde); color: var(--soluk); margin-left: 6px; }
  .canli-kutu { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--cizgi); }
  .canli-kutu h3 { margin: 0 0 4px; font: 600 19px/1.15 var(--baslik); }
  .canli { position: relative; width: 100%; height: 100%; display: grid; place-items: center; background: #000; }
  .canli video { max-width: 100%; max-height: calc(100vh - 170px); display: block; }
  .canli svg { position: absolute; pointer-events: none; }
  .canli .durum-yazi { position: absolute; left: 10px; top: 10px; padding: 4px 10px; background: var(--murekkep); color: var(--serit); font: 600 16px/1.2 var(--baslik); }
  .canli-parca { fill: rgba(244, 194, 13, .15); stroke: var(--serit); }
  .canli-etiket rect { fill: var(--serit); }
  .canli-etiket text { font-family: var(--baslik); font-weight: 700; fill: var(--murekkep); }
  .nesneler ul { margin: 0; padding-left: 18px; color: var(--soluk); font-size: 14.5px; }
  .nesneler li { margin: 2px 0; }
  .olcu rect { fill: var(--serit); }
  .olcu text { font-family: var(--baslik); font-weight: 700; fill: var(--murekkep); }
  .nokta circle { fill: var(--murekkep); stroke: var(--serit); }
  .nokta text { font-family: var(--baslik); font-weight: 700; fill: var(--serit); }
  .nokta.vurgu circle { fill: var(--serit); }
  .nokta.vurgu text { fill: var(--murekkep); }
  .sifir circle { fill: var(--yesil); stroke: var(--emaye); }
  .sifir text { font-family: var(--baslik); font-weight: 700; fill: var(--yesil-koyu); }

  /* Yan pano */
  .pano { background: var(--emaye); border-left: 1px solid var(--cizgi); overflow-y: auto; }
  .adim { padding: 20px 22px 22px; border-bottom: 1px solid var(--cizgi); }
  .adim h2 { margin: 0 0 4px; font: 600 24px/1.1 var(--baslik); display: flex; gap: 10px; align-items: baseline; }
  .adim h2 .no {
    font-size: 17px; width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: inline-grid; place-items: center; background: var(--murekkep); color: var(--emaye);
    transform: translateY(-2px);
  }
  .adim > p { margin: 0 0 14px; color: var(--soluk); font-size: 15px; }
  .satir { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  label.alan { display: grid; gap: 4px; font-size: 14px; color: var(--soluk); flex: 1; min-width: 110px; }
  label.alan input {
    padding: 8px 10px; border: 1px solid var(--cizgi); border-radius: 4px; background: #fff;
    font: 600 20px/1.2 var(--baslik); font-variant-numeric: tabular-nums; width: 100%;
  }
  .dugme {
    border: 1px solid var(--yesil-koyu); background: var(--yesil); color: #fff; cursor: pointer;
    padding: 10px 16px; border-radius: 4px; font-weight: 600; font-size: 16px;
  }
  .dugme:hover { background: var(--yesil-koyu); }
  .dugme.ikincil { background: transparent; color: var(--yesil-koyu); }
  .dugme.ikincil:hover { background: rgba(20, 122, 67, .08); }
  .dugme:disabled { opacity: .5; cursor: default; }
  .dugmeler { display: flex; gap: 8px; flex-wrap: wrap; }

  .kalinlik-satir { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 6px; }
  .kalinlik-satir .alan { flex: 0 1 130px; }
  .hizli { display: flex; flex: 1; min-width: 160px; }
  .hizli button {
    flex: 1; padding: 9px 0; cursor: pointer; border: 1px solid var(--cizgi); border-left-width: 0; background: #fff;
    font: 600 20px/1 var(--baslik); font-variant-numeric: tabular-nums;
  }
  .hizli button:first-child { border-left-width: 1px; border-radius: 4px 0 0 4px; }
  .hizli button:last-child { border-radius: 0 4px 4px 0; }
  .hizli button[aria-pressed="true"] { background: var(--murekkep); color: var(--serit); border-color: var(--murekkep); }
  .kalinlik { display: flex; gap: 0; margin-bottom: 6px; }
  .kalinlik label { flex: 1; }
  .kalinlik input { position: absolute; opacity: 0; pointer-events: none; }
  .kalinlik span {
    display: block; text-align: center; padding: 9px 0; cursor: pointer;
    border: 1px solid var(--cizgi); border-left-width: 0; background: #fff;
    font: 600 22px/1 var(--baslik); font-variant-numeric: tabular-nums;
  }
  .kalinlik label:first-child span { border-left-width: 1px; border-radius: 4px 0 0 4px; }
  .kalinlik label:last-child span { border-radius: 0 4px 4px 0; }
  .kalinlik input:checked + span { background: var(--murekkep); color: var(--serit); border-color: var(--murekkep); }
  .kalinlik input:focus-visible + span { outline: 3px solid var(--serit); outline-offset: 2px; position: relative; }
  .onay { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; margin: 12px 0 14px; cursor: pointer; }
  .onay input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--yesil); }
  .onay small { display: block; color: var(--soluk); font-size: 13.5px; }

  .hata {
    margin: 0 22px 0; padding: 10px 12px; border-left: 4px solid var(--uyari);
    background: #fbeee8; color: #6d2206; font-size: 15px;
  }
  .hata[hidden] { display: none; }

  .parca { padding: 18px 22px; border-bottom: 1px solid var(--cizgi); }
  .parca h3 { margin: 0; font: 600 22px/1.1 var(--baslik); }
  .parca .boyut { font: 700 40px/1.05 var(--baslik); font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .parca .boyut small { font-size: 20px; font-weight: 500; color: var(--soluk); }
  .parca .ek { color: var(--soluk); font-size: 14.5px; margin: 0 0 10px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-weight: 500; font-size: 13.5px; color: var(--soluk); padding: 2px 0 4px; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 5px 0; border-top: 1px solid var(--cizgi); font: 600 19px/1.2 var(--baslik); }
  td:first-child { font-weight: 500; color: var(--soluk); }
  tr.vurgu td { background: #fdf4c9; }
  .kopya { margin-top: 12px; }

  .calisiyor .tuval::after {
    content: "Ölçülüyor…"; position: absolute; inset: auto 12px 12px auto; padding: 6px 12px;
    background: var(--murekkep); color: var(--serit); font: 600 18px/1 var(--baslik);
  }

  @media (max-width: 900px) {
    .duzen { grid-template-columns: 1fr; grid-template-rows: auto auto auto; grid-template-areas: "kontrol" "sahne" "sonuclar"; }
    .kontrol, .sonuclar { border-left: 0; }
    .kontrol { padding: 12px 14px 4px; border-bottom: 1px solid var(--cizgi); }
    .sonuclar { border-top: 1px solid var(--cizgi); overflow: visible; }
    .sahne { padding: 12px 14px; }
    .tuval { min-height: 240px; }
    .tuval svg, .canli video { max-height: 62vh; }
    .ust { padding: 10px 14px; gap: 6px 14px; }
    .ust h1 { font-size: 23px; }
    .ust .durum { margin-left: 0; width: 100%; font-size: 14px; }
    .bos { padding: 20px 16px; }
    .bos h2 { font-size: 25px; }
    .parca .boyut { font-size: 34px; }
  }
  @media (max-width: 420px) {
    .modlar span { font-size: 15px; padding: 9px 2px; }
    .ana-dugmeler { grid-template-columns: 1fr; }
    .hizli { min-width: 0; }
  }
</style>
</head>
<body>
<header class="ust">
  <h1>Köprü kesim ölçüm tablası</h1>
  <div class="durum" id="durum"></div>
</header>

<div class="duzen">
  <section class="kontrol" aria-label="Ayarlar ve ölçüm">
    <div class="modlar" role="radiogroup" aria-label="Çalışma şekli">
      <label><input type="radio" name="mod" value="tek" checked><span>Tek fotoğraf</span></label>
      <label><input type="radio" name="mod" value="kurulum"><span>Sabit kamera</span></label>
      <label><input type="radio" name="mod" value="isaret"><span>İşaretli</span></label>
    </div>
    <p class="mod-aciklama" id="modAciklama"></p>
    <input type="checkbox" id="tekfoto" checked hidden>

    <div class="grup" data-mod="tek kurulum">
      <h2>Tabla</h2>
      <div class="satir">
        <label class="alan">Uzunluk, X (mm)
          <input id="uzunluk" type="number" min="100" step="1" value="3300" inputmode="numeric">
        </label>
        <label class="alan">Genişlik, Y (mm)
          <input id="genislik" type="number" min="100" step="1" value="2000" inputmode="numeric">
        </label>
      </div>
      <label class="onay">
        <input type="checkbox" id="tekrenk">
        <span>Yüzey tek renkli (masa, levha)
          <small>Ahşap tablada kapalı tutun; açıkken taştan biraz koyu ya da açık nesneler de bulunur.</small>
        </span>
      </label>
    </div>

    <div class="grup" data-mod="kurulum">
      <h2>Kurulum</h2>
      <p class="ipucu-kucuk">Kamera takılınca bir kez, tabla boşken yapılır. Kamera oynarsa tekrarlayın.</p>
      <div class="dugmeler">
        <button class="dugme ikincil" data-sec="kur">Boş tabla fotoğrafı seç</button>
        <button class="dugme ikincil" data-ornek="bos">Örnek boş tabla</button>
      </div>
      <label class="onay">
        <input type="checkbox" id="referans">
        <span>Boş tabla fotoğrafıyla karşılaştır
          <small>Koyu ya da tahta rengine yakın taşlar için; kamera kurulumdaki yerindeyse işe yarar.</small>
        </span>
      </label>
    </div>

    <div class="grup" data-mod="isaret">
      <h2>Konum işaretleri</h2>
      <p id="isaretDurum">Kapalı.</p>
      <p class="ipucu-kucuk">Makineye sabitlenmiş işaretlerin yerleşim dosyası. Kalibrasyon her fotoğrafta işaretlerden hesaplanır.</p>
      <div class="dugmeler">
        <button class="dugme ikincil" data-sec="isaret">İşaret dosyası yükle</button>
        <button class="dugme ikincil" id="isaretKaldir" hidden>İşaretleri kapat</button>
      </div>
    </div>

    <div class="grup olcum-grup">
      <h2>Ölçüm</h2>
      <div class="kalinlik-satir">
        <label class="alan">Kalınlık (mm)
          <input id="kalinlik" type="number" min="0" step="0.5" value="20" inputmode="decimal">
        </label>
        <div class="hizli" role="group" aria-label="Hazır kalınlıklar">
          <button type="button" data-k="0">0</button><button type="button" data-k="10">10</button><button type="button" data-k="20">20</button><button type="button" data-k="30">30</button>
        </div>
      </div>
      <div class="ana-dugmeler">
        <button class="dugme buyuk" data-sec="olc" id="olcDugme">Fotoğraf yükle</button>
        <button class="dugme buyuk ikincil" data-sec="cek" id="cekDugme">Fotoğraf çek</button>
        <button class="dugme buyuk ikincil" id="canliDugme">Canlı kamera</button>
      </div>
      <div class="canli-ayar">
        <button class="dugme ikincil" id="kareDugme" hidden>Bu kareyi ölç</button>
        <label class="onay"><input type="checkbox" id="surekli" checked><span>Canlıda sürekli ölç</span></label>
      </div>
      <button class="baglanti" data-ornek="mermer" id="olcOrnek" data-mod="kurulum">Örnek mermerle dene</button>
    </div>
  </section>

  <main class="sahne" id="sahne">
    <div class="sekmeler" role="tablist">
      <button class="sekme" role="tab" id="sekmeKamera" aria-selected="true">Fotoğraf</button>
      <button class="sekme" role="tab" id="sekmeOlcum" aria-selected="false" disabled>Üstten ölçüm</button>
    </div>
    <div class="tuval" id="tuval"></div>
    <p class="ipucu" id="ipucu"></p>
  </main>

  <section class="sonuclar" aria-label="Sonuçlar">
    <p class="hata" id="hata" hidden role="alert"></p>
    <div id="sonuc"></div>
  </section>
</div>

<input type="file" id="dosya" accept="image/*" hidden>
<input type="file" id="cekDosya" accept="image/*" capture="environment" hidden>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const el = (ad, oz = {}, ...cocuk) => {
    const e = document.createElementNS(NS, ad);
    for (const k in oz) e.setAttribute(k, oz[k]);
    cocuk.forEach(c => e.append(c));
    return e;
  };
  const sayi = (v, hane = 0) => v.toLocaleString("tr-TR", { minimumFractionDigits: hane, maximumFractionDigits: hane, useGrouping: false });
  const SEKIL = { Dikdortgen: "dikdörtgen", Kare: "kare", Ucgen: "üçgen", Dortgen: "dörtgen", Cokgen: "çokgen" };

  let durum = { kurulu: false };
  let sonOlcum = null;      // son olcum yaniti
  let sonFoto = null;       // son olculen fotograf (kalinlik degisince yeniden olcmek icin)
  let bekleyen = null;      // dosya secici hangi is icin acildi: "kur" | "olc"
  let gorunum = "kamera";

  // ---------- sunucu ----------
  async function istek(yol, form) {
    const r = await fetch(yol, form ? { method: "POST", body: form } : undefined);
    const veri = await r.json().catch(() => ({ hata: "Sunucudan anlaşılır bir yanıt gelmedi." }));
    if (!r.ok) throw new Error(veri.hata || "İstek başarısız oldu.");
    return veri;
  }
  function hata(mesaj) { const h = $("hata"); h.textContent = mesaj || ""; h.hidden = !mesaj; }

  async function kur(dosya) {
    hata("");
    const f = new FormData();
    f.append("dosya", dosya);
    f.append("uzunluk", $("uzunluk").value);
    f.append("genislik", $("genislik").value);
    try {
      const y = await istek("/api/kur", f);
      durum = y.durum; sonOlcum = null; sonFoto = null; $("sonuc").replaceChildren();
      gorunum = "kamera"; ciz();
      if (!y.otomatikBulundu) hata("Tabla köşeleri otomatik bulunamadı. Sarı noktaları tablanın dört köşesine sürükleyin.");
    } catch (e) { hata(e.message); }
  }

  async function koseleriKaydet() {
    const f = new FormData();
    f.append("koseler", durum.koseler.map(k => k.join(",")).join(";"));
    f.append("uzunluk", $("uzunluk").value);
    f.append("genislik", $("genislik").value);
    f.append("incelt", "1");
    try { durum = await istek("/api/koseler", f); hata(""); ciz(); if (sonFoto) olc(sonFoto, false); }
    catch (e) { hata(e.message); }
  }

  function olcumFormu(dosya) {
    const f = new FormData();
    f.append("dosya", dosya);
    f.append("kalinlik", String(Math.max(0, parseFloat(String($("kalinlik").value).replace(",", ".")) || 0)));
    f.append("referans", $("referans").checked ? "1" : "0");
    f.append("tekrenk", $("tekrenk").checked ? "1" : "0");
    f.append("tekfoto", $("tekfoto").checked ? "1" : "0");
    f.append("uzunluk", $("uzunluk").value);
    f.append("genislik", $("genislik").value);
    return f;
  }

  async function olc(dosya, gecis = true) {
    if (canli.akis) kamerayiKapat();
    hata("");
    const f = new FormData();
    f.append("dosya", dosya);
    f.append("kalinlik", String(Math.max(0, parseFloat(String($("kalinlik").value).replace(",", ".")) || 0)));
    f.append("referans", $("referans").checked ? "1" : "0");
    f.append("tekrenk", $("tekrenk").checked ? "1" : "0");
    f.append("tekfoto", $("tekfoto").checked ? "1" : "0");
    f.append("uzunluk", $("uzunluk").value);
    f.append("genislik", $("genislik").value);
    $("sahne").classList.add("calisiyor");
    try {
      sonOlcum = await istek("/api/olc", f);
      sonFoto = dosya;
      if (gecis) gorunum = "olcum";
      ciz(); sonucYaz();
      // Telefonda sonuc ayarlarin altinda kalir: goruntuye kaydir
      if (window.matchMedia("(max-width: 900px)").matches) $("sahne").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) { hata(e.message); }
    finally { $("sahne").classList.remove("calisiyor"); }
  }

  async function ornek(ad) {
    try {
      const r = await fetch("/api/ornek/" + ad);
      if (!r.ok) throw new Error("Örnek görsel bulunamadı.");
      const dosya = new File([await r.blob()], ad + ".webp", { type: "image/webp" });
      ad === "bos" ? await kur(dosya) : await olc(dosya);
    } catch (e) { hata(e.message); }
  }

  // ---------- cizim ----------
  function durumYaz() {
    const d = $("durum");
    if (mod === "tek") {
      d.innerHTML = `Tek fotoğraf, tabla <b>${sayi(+$("uzunluk").value || 0)} × ${sayi(+$("genislik").value || 0)} mm</b>`;
    } else if (mod === "isaret") {
      d.innerHTML = durum.isaretli ? `İşaretli, <b>${durum.isaretli.sayi} işaret</b>` : "İşaretli: dosya yüklenmedi";
    } else if (!durum.kurulu || !durum.koseler) {
      d.textContent = "Sabit kamera: kurulum bekleniyor";
    } else {
      d.innerHTML = `Sabit kamera, tabla <b>${sayi(durum.tabla.uzunluk)} × ${sayi(durum.tabla.genislik)} mm</b>` +
        (durum.tutarlilik != null ? `, tutarlılık <b>${sayi(durum.tutarlilik, 2)}</b>` : "");
      $("uzunluk").value = durum.tabla.uzunluk; $("genislik").value = durum.tabla.genislik;
    }
    const isd = $("isaretDurum");
    if (durum.isaretli) {
      isd.textContent = `Açık: ${durum.isaretli.sayi} işaret (numaralar ${[...durum.isaretli.numaralar].join(", ")}). Kalibrasyon her fotoğrafta yeniden hesaplanır.`;
      isd.className = "acik";
    } else { isd.textContent = "Kapalı. Kamera oynarsa ölçüm kayar."; isd.className = ""; }
    $("isaretKaldir").hidden = !durum.isaretli;
    const hazir = mod === "tek" || (mod === "kurulum" && durum.kurulu && durum.koseler) || (mod === "isaret" && durum.isaretli);
    ["olcDugme", "cekDugme", "canliDugme", "olcOrnek"].forEach(id => $(id).disabled = !hazir);
    $("sekmeOlcum").disabled = !sonOlcum;
    $("sekmeKamera").setAttribute("aria-selected", gorunum === "kamera");
    $("sekmeOlcum").setAttribute("aria-selected", gorunum === "olcum");
  }

  function ciz() {
    durumYaz();
    if (gorunum === "canli" && canli.akis) return;   // canli goruntu kendi cizimini yapar
    const tuval = $("tuval");
    if (gorunum === "kamera" && sonOlcum && sonOlcum.tekFoto) {
      tuval.replaceChildren(tekFotoCiz());
      $("ipucu").textContent = "Tabla bu fotoğrafta bulundu. Sarı çerçeve tablanın kenarlarına oturmuyorsa ölçüm yanlıştır; tablanın tamamı görünecek şekilde yeniden çekin.";
      return;
    }
    if (gorunum === "olcum" && sonOlcum) { tuval.replaceChildren(olcumCiz()); $("ipucu").textContent = "Koordinatlar 0 noktasına göre milimetre. Sarı etiketler kenar uzunluğudur."; return; }
    if (mod === "tek" || (mod === "isaret" && !durum.isaretli) || !durum.kurulu || !durum.koseler) { tuval.replaceChildren(bosDurum()); $("ipucu").textContent = ""; return; }
    if (gorunum === "olcum" && sonOlcum) { tuval.replaceChildren(olcumCiz()); $("ipucu").textContent = "Koordinatlar 0 noktasına göre milimetre. Sarı etiketler kenar uzunluğudur."; }
    else if (!durum.koseler) {
      const k = document.createElement("div"); k.className = "bos";
      k.innerHTML = "<h2>İşaretli mod</h2><p>Kalibrasyon her ölçüm fotoğrafındaki konum işaretlerinden hesaplanır; boş tabla kurulumu gerekmez. Mermerin kalınlığını seçip fotoğrafını yükleyin.</p>";
      tuval.replaceChildren(k); $("ipucu").textContent = "";
    }
    else { tuval.replaceChildren(kameraCiz()); $("ipucu").textContent = durum.isaretli
      ? "İşaretli mod açık: ölçümde bu köşeler değil, fotoğraftaki işaretler kullanılır. Bu görüntü yalnızca boş tabla karşılaştırması içindir."
      : "Sarı çerçeve tablanın kenarlarına oturmalı. Oturmuyorsa köşe noktalarını sürükleyin; değişiklik bırakınca kaydedilir."; }
  }

  async function isaretYukle(dosya) {
    hata("");
    const f = new FormData(); f.append("dosya", dosya);
    try { durum = await istek("/api/isaretler", f); sonOlcum = null; $("sonuc").replaceChildren(); gorunum = "kamera"; ciz(); }
    catch (e) { hata(e.message); }
  }
  async function isaretKaldir() {
    try { durum = await istek("/api/isaretler/kaldir", new FormData()); ciz(); } catch (e) { hata(e.message); }
  }

  // Kamera fotografi + suruklenebilir dort kose
  // Moda gore bos ekran: ne yapilacagini soyler
  function bosDurum() {
    const k = document.createElement("div"); k.className = "bos";
    const metin = {
      tek: ["Fotoğraf yükleyin", "Tablanın tamamı ve üstündeki taş görünecek şekilde çekilmiş bir fotoğraf yükleyin. Kurulum gerekmez: tabla bu fotoğrafta bulunur, taş ona göre ölçülür. Soldaki tabla ölçüsünün doğru olduğundan emin olun."],
      kurulum: ["Önce boş tablayı tanıtın", "Sabit kamerada bir kez, tabla boşken fotoğraf yükleyin. Program dört köşeyi bulur; sonra her ölçümde yalnızca taşın fotoğrafı yüklenir."],
      isaret: ["İşaret dosyasını yükleyin", "Makineye sabitlenmiş konum işaretlerinin yerleşim dosyasını yükleyin; sonra taşın fotoğrafını yükleyin."]
    }[mod];
    k.innerHTML = `<h2>${metin[0]}</h2><p>${metin[1]}</p>`;
    const dd = document.createElement("div"); dd.className = "dugmeler";
    const b1 = document.createElement("button"); b1.className = "dugme";
    if (mod === "tek") { b1.textContent = "Fotoğraf yükle"; b1.onclick = () => $("olcDugme").click(); }
    else if (mod === "kurulum") { b1.textContent = "Boş tabla fotoğrafı seç"; b1.onclick = () => document.querySelector('[data-sec="kur"]').click(); }
    else { b1.textContent = "İşaret dosyası yükle"; b1.onclick = () => document.querySelector('[data-sec="isaret"]').click(); }
    dd.append(b1); k.append(dd);
    return k;
  }

  // Tek fotograf modunda son olculen fotograf + programin buldugu tabla koseleri (yalniz gosterim)
  function tekFotoCiz() {
    const { w, h } = sonOlcum.goruntuBoyutu, b = Math.max(w, h) / 100, k = sonOlcum.tablaKoseleri;
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": "Ölçüm fotoğrafı ve bulunan tabla" });
    if (!tekFotoCiz.url || tekFotoCiz.dosya !== sonFoto) {
      if (tekFotoCiz.url) URL.revokeObjectURL(tekFotoCiz.url);
      tekFotoCiz.url = URL.createObjectURL(sonFoto); tekFotoCiz.dosya = sonFoto;
    }
    svg.append(el("image", { href: tekFotoCiz.url, width: w, height: h }));
    svg.append(el("polygon", { class: "cerceve", points: k.map(p => p.join(",")).join(" "), "stroke-width": b * 0.3 }));
    k.forEach((p, i) => svg.append(el("g", { class: "kose", transform: `translate(${p[0]},${p[1]})` }, el("circle", { r: b * 0.9, "stroke-width": b * 0.25 }))));
    const t = el("text", { class: "eksen-yazi", x: k[0][0] + b * 2, y: k[0][1] + b * 4, "font-size": b * 3.2, "stroke-width": b * 0.5 }); t.textContent = "0";
    svg.append(t);
    return svg;
  }

  function kameraCiz() {
    const { w, h } = durum.goruntu, b = Math.max(w, h) / 100;   // b: cizim birimi
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": "Kamera görüntüsü ve tabla köşeleri" });
    svg.append(el("image", { href: "/api/referans?t=" + Date.now(), width: w, height: h }));
    const cerceve = el("polygon", { class: "cerceve", "stroke-width": b * 0.3 });
    const etiket = [["0", 0], ["Y", 1], ["X", 3]].map(([yazi, i]) => {
      const t = el("text", { class: "eksen-yazi", "font-size": b * 3.6, "stroke-width": b * 0.5, "text-anchor": "middle" });
      t.textContent = yazi; t.dataset.i = i; return t;
    });
    const noktalar = durum.koseler.map((_, i) => {
      const g = el("g", { class: "kose", tabindex: 0, role: "slider", "aria-label": ["0 noktası", "Y sonu", "Uzak köşe", "X sonu"][i] },
        el("circle", { r: b * 1.1, "stroke-width": b * 0.3 }));
      g.dataset.i = i; return g;
    });
    const yerlestir = () => {
      const k = durum.koseler;
      cerceve.setAttribute("points", k.map(p => p.join(",")).join(" "));
      const orta = [k.reduce((s, p) => s + p[0], 0) / 4, k.reduce((s, p) => s + p[1], 0) / 4];
      noktalar.forEach((g, i) => g.setAttribute("transform", `translate(${k[i][0]},${k[i][1]})`));
      etiket.forEach(t => {
        const p = k[t.dataset.i], dx = orta[0] - p[0], dy = orta[1] - p[1], u = Math.hypot(dx, dy) || 1;
        t.setAttribute("x", p[0] + dx / u * b * 5); t.setAttribute("y", p[1] + dy / u * b * 5 + b * 1.2);
      });
    };
    svg.append(cerceve, ...etiket, ...noktalar);
    yerlestir();

    // Surukleme (isaretci) ve ok tuslari
    let aktif = null;
    const konum = e => { const m = svg.getScreenCTM().inverse(); const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
      return [Math.min(w, Math.max(0, +p.x.toFixed(1))), Math.min(h, Math.max(0, +p.y.toFixed(1)))]; };
    noktalar.forEach(g => {
      g.addEventListener("pointerdown", e => { aktif = +g.dataset.i; g.setPointerCapture(e.pointerId); e.preventDefault(); });
      g.addEventListener("pointermove", e => { if (aktif === null) return; durum.koseler[aktif] = konum(e); yerlestir(); });
      g.addEventListener("pointerup", () => { if (aktif !== null) { aktif = null; koseleriKaydet(); } });
      g.addEventListener("keydown", e => {
        const ad = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
        if (!ad) return; e.preventDefault();
        const i = +g.dataset.i, c = e.shiftKey ? 10 : 1;
        durum.koseler[i] = [durum.koseler[i][0] + ad[0] * c, durum.koseler[i][1] + ad[1] * c]; yerlestir();
        clearTimeout(g._t); g._t = setTimeout(koseleriKaydet, 500);
      });
    });
    return svg;
  }

  // Ustten gorunum: mm cetveli, parcalar, kenar olculeri
  function olcumCiz() {
    const L = sonOlcum.tabla.uzunluk, W = sonOlcum.tabla.genislik;
    const b = Math.max(L, W) / 100;                       // cizim birimi (mm)
    const sol = b * 7, alt = b * 5.5, ust = b * 2, sag = b * 2.5;
    const Y = y => W - y;                                 // tabla Y yukari, svg asagi
    const svg = el("svg", { viewBox: `${-sol} ${-ust} ${L + sol + sag} ${W + ust + alt}`, role: "img", "aria-label": "Tablanın üstten görünümü ve ölçülen parçalar" });
    svg.append(el("image", { href: sonOlcum.goruntu, x: 0, y: 0, width: L, height: W, preserveAspectRatio: "none" }));
    svg.append(el("rect", { x: 0, y: 0, width: L, height: W, fill: "none", stroke: "var(--murekkep)", "stroke-width": b * 0.15 }));

    // Cetveller: 100 mm cizgi, 500 mm yazi
    const cetvel = el("g", { class: "cetvel" });
    for (let x = 0; x <= L; x += 100) {
      const buyuk = x % 500 === 0;
      cetvel.append(el("line", { x1: x, x2: x, y1: W, y2: W + b * (buyuk ? 1.4 : 0.7), "stroke-width": b * (buyuk ? 0.18 : 0.1) }));
      if (buyuk && x > 0) { const t = el("text", { x, y: W + b * 3.6, "text-anchor": "middle", "font-size": b * 1.9 }); t.textContent = sayi(x); cetvel.append(t); }
    }
    for (let y = 0; y <= W; y += 100) {
      const buyuk = y % 500 === 0;
      cetvel.append(el("line", { y1: Y(y), y2: Y(y), x1: 0, x2: -b * (buyuk ? 1.4 : 0.7), "stroke-width": b * (buyuk ? 0.18 : 0.1) }));
      if (buyuk && y > 0) { const t = el("text", { x: -b * 1.9, y: Y(y) + b * 0.65, "text-anchor": "end", "font-size": b * 1.9 }); t.textContent = sayi(y); cetvel.append(t); }
    }
    const ex = el("text", { x: L, y: W + b * 5.2, "text-anchor": "end", "font-size": b * 1.7 }); ex.textContent = "X, mm";
    const ey = el("text", { x: -sol + b * 0.3, y: -b * 0.5, "font-size": b * 1.7 }); ey.textContent = "Y, mm";
    cetvel.append(ex, ey);
    svg.append(cetvel);

    // 0 noktasi
    const sifir = el("g", { class: "sifir" }, el("circle", { cx: 0, cy: W, r: b * 0.9, "stroke-width": b * 0.25 }));
    const st = el("text", { x: -b * 1.9, y: W + b * 3.6, "text-anchor": "end", "font-size": b * 2.6 }); st.textContent = "0";
    sifir.append(st); svg.append(sifir);

    sonOlcum.parcalar.forEach((p, pi) => {
      const k = p.koseler, n = k.length;
      const pts = k.map(v => `${v[0]},${Y(v[1])}`).join(" ");
      if (!p.guvenilir) {
        // Mermer gibi gorunmeyen nesne: yalnizca kesik cizgili sinir, olcu etiketi yok
        svg.append(el("polygon", { class: "nesne-cizgi", points: pts, "stroke-width": b * 0.3, "stroke-dasharray": `${b * 1.2} ${b * 0.9}` }));
        return;
      }
      svg.append(el("polygon", { class: "parca-golge", points: pts, "stroke-width": b * 0.75 }));
      svg.append(el("polygon", { class: "parca-cizgi", points: pts, "stroke-width": b * 0.35 }));
      const mx = k.reduce((s, v) => s + v[0], 0) / n, my = k.reduce((s, v) => s + v[1], 0) / n;
      // Kenar uzunlugu etiketleri: kenarin ortasinda, parcanin icine dogru
      k.forEach((a, i) => {
        const c = k[(i + 1) % n], uz = p.kenarlar[i];
        if (uz < b * 9) return;                            // kisa kenara etiket sigmaz
        let x = (a[0] + c[0]) / 2, y = (a[1] + c[1]) / 2;
        const dx = mx - x, dy = my - y, u = Math.hypot(dx, dy) || 1;
        x += dx / u * b * 2.6; y += dy / u * b * 2.6;
        const yazi = sayi(uz), gen = yazi.length * b * 1.25 + b * 1.4, yuk = b * 2.9;
        const g = el("g", { class: "olcu" },
          el("rect", { x: x - gen / 2, y: Y(y) - yuk / 2, width: gen, height: yuk, rx: b * 0.3 }));
        const t = el("text", { x, y: Y(y) + b * 0.78, "text-anchor": "middle", "font-size": b * 2.2 }); t.textContent = yazi;
        g.append(t); svg.append(g);
      });
      k.forEach((v, i) => {
        const g = el("g", { class: "nokta", id: `n-${pi}-${i}` }, el("circle", { cx: v[0], cy: Y(v[1]), r: b * 1.35, "stroke-width": b * 0.25 }));
        const t = el("text", { x: v[0], y: Y(v[1]) + b * 0.62, "text-anchor": "middle", "font-size": b * 1.7 }); t.textContent = i + 1;
        g.append(t); svg.append(g);
      });
    });
    return svg;
  }

  function sonucYaz() {
    const kutu = $("sonuc"); kutu.replaceChildren();
    if (!sonOlcum) return;
    if (sonOlcum.isaretler) {
      const s = sonOlcum.isaretler, p = document.createElement("p"); p.className = "isaret-bilgi parca";
      p.textContent = `Kalibrasyon bu fotoğraftaki ${s.kullanilan.length} işaretten hesaplandı (uyum ortalama ${sayi(s.ortalamaMm, 1)} mm, en kötü ${sayi(s.enKotuMm, 1)} mm).` +
        (s.gorunmeyen.length ? ` Görünmeyen: ${s.gorunmeyen.join(", ")}.` : "") +
        (s.atilan.length ? ` Diğerleriyle uyuşmadığı için kullanılmayan: ${s.atilan.join(", ")}; yerinden oynamış olabilir.` : "");
      kutu.append(p);
    }
    if (sonOlcum.uyarilar && sonOlcum.uyarilar.length) {
      const u = document.createElement("div"); u.className = "uyari";
      u.innerHTML = "<h3>Ölçüm sapabilir</h3>" + sonOlcum.uyarilar.map(m => `<p>${m}</p>`).join("");
      kutu.append(u);
    }
    if (sonOlcum.canliOrtanca) {
      const p = document.createElement("p"); p.className = "isaret-bilgi parca";
      p.textContent = `Canlı: son ${sonOlcum.canliOrtanca.n} ölçümün ortancası ${sayi(sonOlcum.canliOrtanca.a)} × ${sayi(sonOlcum.canliOrtanca.b)} mm (oynama ±${sayi(sonOlcum.canliOrtanca.yayilim)} mm).`;
      kutu.append(p);
    }
    if (sonOlcum.tablaYenidenBulundu) {
      const p = document.createElement("p"); p.className = "isaret-bilgi parca";
      p.textContent = "Kamera kurulumdaki yerinde değildi; tabla bu fotoğrafta yeniden bulundu ve ölçüm bu köşelerle yapıldı. Sonuç beklenmedik görünürse Kamera görüntüsü sekmesinde köşeleri kontrol edin.";
      kutu.append(p);
    }
    if (sonOlcum.kameraOynamis) {
      const u = document.createElement("div"); u.className = "uyari";
      u.innerHTML = "<h3>Kamera kurulumdaki yerinde değil</h3><p>Tablanın kenarları bu fotoğrafta kurulumda bulunan yerlerde görünmüyor" +
        (sonOlcum.kenarGorunurlugu != null ? ` (kenarların yalnızca %${sayi(sonOlcum.kenarGorunurlugu * 100)}'i yerinde)` : "") +
        ". Koordinatlar bu yüzden kayar. Kamera oynadıysa kurulumu yenileyin; boş tabla fotoğrafı ile ölçüm fotoğrafı aynı sabit kameradan çekilmeli.</p>";
      kutu.append(u);
    }
    const guvenilir = sonOlcum.parcalar.filter(p => p.guvenilir);
    const digerleri = sonOlcum.parcalar.filter(p => !p.guvenilir);
    if (!guvenilir.length) {
      const d = document.createElement("div"); d.className = "parca";
      d.innerHTML = "<h3>Mermer bulunamadı</h3><p class='ek'>" + (digerleri.length
        ? "Tablada nesneler var ama hiçbiri düz kenarlı bir plakaya benzemiyor."
        : "Tabla boş görünüyor. Taş tahta rengine yakınsa “Boş tabla fotoğrafıyla karşılaştır” seçeneğini açıp yeniden deneyin.") + "</p>";
      kutu.append(d);
    }
    if (digerleri.length) {
      const d = document.createElement("div"); d.className = "parca nesneler";
      d.innerHTML = `<h3>Ölçülmeyen nesneler: ${digerleri.length}</h3><p class="ek">Görüntüde kesik çizgiyle gösterildi. Şekilleri düz kenarlı bir plakaya uymadığı için (alet, makine parçası, kısmen görünen taş) köşe verilmedi.</p>` +
        "<ul>" + digerleri.map(p => `<li>${sayi(p.alanCm2 / 10000, 2)} m²: ${(p.not || "").replace("Mermer gibi gorunmuyor: ", "")
          .replace("kenarlari kesisiyor", "kenarları kesişiyor").replace("sekli girintili cikintili", "şekli girintili çıkıntılı")
          .replace("kenarlari duz degil", "kenarları düz değil").replace(" kose", " köşe")}</li>`).join("") + "</ul>";
      kutu.append(d);
    }
    guvenilir.forEach((p) => {
      const pi = sonOlcum.parcalar.indexOf(p);
      const d = document.createElement("div"); d.className = "parca";
      const dortgen = p.koseler.length === 4;
      const boyut = dortgen
        ? `${sayi((p.kenarlar[0] + p.kenarlar[2]) / 2)} × ${sayi((p.kenarlar[1] + p.kenarlar[3]) / 2)} <small>mm</small>`
        : `${sayi(p.alanCm2 / 10000, 2)} <small>m²</small>`;
      d.innerHTML = `<h3>Parça ${pi + 1}, ${SEKIL[p.sekil] || p.sekil}${p.yontem === "kenar" ? " <small class=\"yontem\">kenarlarından bulundu</small>" : ""}</h3>
        <div class="boyut">${boyut}</div>
        <p class="ek">Alan ${sayi(p.alanCm2 / 10000, 2)} m², dönme ${sayi(p.donme, 1)}°, kalınlık ${sayi(sonOlcum.kalinlik)} mm</p>
        <table><thead><tr><th>Köşe</th><th>X (mm)</th><th>Y (mm)</th></tr></thead><tbody>${
          p.koseler.map((v, i) => `<tr data-n="n-${pi}-${i}"><td>${i + 1}</td><td>${sayi(v[0], 1)}</td><td>${sayi(v[1], 1)}</td></tr>`).join("")
        }</tbody></table>`;
      const kopya = document.createElement("button");
      kopya.className = "dugme ikincil kopya"; kopya.textContent = "Köşeleri kopyala";
      kopya.onclick = async () => {
        const metin = p.koseler.map((v, i) => `K${i + 1}\t${v[0].toFixed(1)}\t${v[1].toFixed(1)}`).join("\n");
        try { await navigator.clipboard.writeText(metin); kopya.textContent = "Köşeler kopyalandı"; }
        catch { kopya.textContent = "Kopyalanamadı"; }
        setTimeout(() => kopya.textContent = "Köşeleri kopyala", 1600);
      };
      d.append(kopya);
      d.querySelectorAll("tbody tr").forEach(tr => {
        const vurgu = ac => { tr.classList.toggle("vurgu", ac); document.getElementById(tr.dataset.n)?.classList.toggle("vurgu", ac); };
        tr.onmouseenter = () => vurgu(true); tr.onmouseleave = () => vurgu(false);
      });
      kutu.append(d);
    });
  }

  // ---------- olaylar ----------
  $("cekDosya").onchange = e => { const f = e.target.files[0]; if (f) olc(f); e.target.value = ""; };
  document.querySelectorAll("[data-sec]").forEach(d => d.onclick = () => {
    if (d.dataset.sec === "cek") { $("cekDosya").click(); return; }
    bekleyen = d.dataset.sec; $("dosya").value = "";
    $("dosya").accept = bekleyen === "isaret" ? ".txt,text/plain" : "image/*";
    $("dosya").click();
  });
  $("isaretKaldir").onclick = isaretKaldir;
  document.querySelectorAll("[data-ornek]").forEach(d => d.onclick = () => ornek(d.dataset.ornek));
  $("dosya").onchange = e => { const f = e.target.files[0]; if (!f) return; bekleyen === "kur" ? kur(f) : bekleyen === "isaret" ? isaretYukle(f) : olc(f); };
  const kalinlikDegisti = () => {
    document.querySelectorAll(".hizli button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === String(parseFloat($("kalinlik").value))));
    clearTimeout(kalinlikDegisti.t); kalinlikDegisti.t = setTimeout(() => sonFoto && olc(sonFoto, false), 400);
  };
  $("kalinlik").oninput = kalinlikDegisti;
  document.querySelectorAll(".hizli button").forEach(b => b.onclick = () => { $("kalinlik").value = b.dataset.k; kalinlikDegisti(); });
  kalinlikDegisti();
  $("referans").onchange = () => sonFoto && olc(sonFoto, false);
  // Sunucudaki sabit kamera kurulumunun olcusu yalnizca o modda degistirilir
  $("uzunluk").onchange = $("genislik").onchange = () => mod === "kurulum" && durum.kurulu && koseleriKaydet();
  $("sekmeKamera").onclick = () => { if (canli.akis) kamerayiKapat(); gorunum = "kamera"; ciz(); };
  $("sekmeOlcum").onclick = () => { if (sonOlcum) { if (canli.akis) kamerayiKapat(); gorunum = "olcum"; ciz(); } };

  // ---------- calisma sekli (mod) ----------
  let mod = "tek";
  const MOD_ACIKLAMA = {
    tek: "Kurulum yok. Tabla her fotoğrafta yeniden bulunur; kamera oynasa da olur.",
    kurulum: "Kamera sabit. Boş tabla bir kez tanıtılır, sonra yalnızca taş fotoğrafı yüklenir.",
    isaret: "Makinedeki konum işaretleri her fotoğrafta tablayı tanımlar."
  };
  function modUygula(yeni, kaydet = true) {
    mod = yeni;
    document.querySelectorAll('input[name="mod"]').forEach(r => r.checked = r.value === mod);
    $("tekfoto").checked = mod === "tek";
    // Tek fotograf modunun tabla olcusu kullanicinin kaydettigidir (sabit kamera kurulumunun olcusu ayridir)
    if (mod === "tek") try {
      const a = JSON.parse(localStorage.getItem("kopruKesimAyar") || "{}");
      if (a.uzunluk) $("uzunluk").value = a.uzunluk;
      if (a.genislik) $("genislik").value = a.genislik;
    } catch (e) { }
    $("modAciklama").textContent = MOD_ACIKLAMA[mod];
    document.querySelectorAll("[data-mod]").forEach(e => e.hidden = !e.dataset.mod.split(" ").includes(mod));
    if (kaydet) try { localStorage.setItem("kopruKesimMod", mod); } catch (e) { }
    if (canli.akis) kamerayiKapat();
    sonOlcum = null; $("sonuc").replaceChildren(); hata("");
    gorunum = "kamera"; ciz();
  }
  document.querySelectorAll('input[name="mod"]').forEach(r => r.onchange = () => modUygula(r.value));

  // ---------- canli kamera ----------
  const canli = { akis: null, video: null, svg: null, yazi: null, mesgul: false, zamanlayici: null };

  // 4 nokta esinden homografi (mm -> piksel); sonuclari canli goruntunun ustune cizmek icin
  function homografi(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    for (let c = 0; c < 8; c++) {                       // kismi pivotlu Gauss eleme
      let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
      for (let r = c + 1; r < 8; r++) { const k = A[r][c] / A[c][c]; for (let j = c; j < 8; j++) A[r][j] -= k * A[c][j]; b[r] -= k * b[c]; }
    }
    const h = new Array(8);
    for (let r = 7; r >= 0; r--) { let t = b[r]; for (let j = r + 1; j < 8; j++) t -= A[r][j] * h[j]; h[r] = t / A[r][r]; }
    return ([x, y]) => { const w = h[6] * x + h[7] * y + 1; return [(h[0] * x + h[1] * y + h[2]) / w, (h[3] * x + h[4] * y + h[5]) / w]; };
  }

  async function kamerayiAc() {
    hata("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      hata("Bu tarayıcı kameraya erişime izin vermiyor. Sayfayı https ile ya da bu bilgisayarda localhost ile açın.");
      return;
    }
    try {
      canli.akis = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 4096 }, height: { ideal: 2160 } }, audio: false });
    } catch (e) { hata("Kamera açılamadı: " + (e.name === "NotAllowedError" ? "izin verilmedi." : e.message)); canli.akis = null; return; }
    const kap = document.createElement("div"); kap.className = "canli";
    canli.video = document.createElement("video"); canli.video.playsInline = true; canli.video.muted = true; canli.video.srcObject = canli.akis;
    canli.svg = el("svg", {}); canli.yazi = document.createElement("div"); canli.yazi.className = "durum-yazi"; canli.yazi.textContent = "Kamera açılıyor…";
    kap.append(canli.video, canli.svg, canli.yazi);
    $("tuval").replaceChildren(kap);
    await canli.video.play();
    gorunum = "canli";
    $("canliDugme").textContent = "Kamerayı kapat"; $("kareDugme").hidden = false;
    $("ipucu").textContent = "Tablanın tamamı görünecek şekilde tutun. Sarı çerçeve bulunan tabla, kalın çizgiler ölçülen parçalardır.";
    canli.svg.setAttribute("viewBox", `0 0 ${canli.video.videoWidth} ${canli.video.videoHeight}`);
    new ResizeObserver(yerlestirSvg).observe(canli.video); yerlestirSvg();
    if ($("surekli").checked) kareOlc();
    else canli.yazi.textContent = "Hazır: \"Bu kareyi ölç\" ile ölçün";
  }

  function yerlestirSvg() {
    if (!canli.video || !canli.svg) return;
    const r = canli.video.getBoundingClientRect(), k = canli.video.parentElement.getBoundingClientRect();
    Object.assign(canli.svg.style, { left: (r.left - k.left) + "px", top: (r.top - k.top) + "px", width: r.width + "px", height: r.height + "px" });
  }

  function kamerayiKapat() {
    clearTimeout(canli.zamanlayici);
    if (canli.akis) canli.akis.getTracks().forEach(t => t.stop());
    canli.akis = null; canli.video = null; canli.svg = null; canli.gecmis = []; canli.onceki = null;
    $("canliDugme").textContent = "Kamerayı aç"; $("kareDugme").hidden = true;
    if (gorunum === "canli") { gorunum = sonOlcum ? "olcum" : "kamera"; ciz(); }
  }

  // Kamera sabit mi: kucultulmus gri karelerin ardisik farki
  function hareket() {
    const v = canli.video, w = 64, h = Math.max(1, Math.round(64 * v.videoHeight / v.videoWidth));
    const c = canli.kucuk || (canli.kucuk = document.createElement("canvas")); c.width = w; c.height = h;
    const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(v, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
    for (let i = 0; i < g.length; i++) g[i] = 0.3 * d[4 * i] + 0.59 * d[4 * i + 1] + 0.11 * d[4 * i + 2];
    let fark = Infinity;
    if (canli.onceki && canli.onceki.length === g.length) { fark = 0; for (let i = 0; i < g.length; i++) fark += Math.abs(g[i] - canli.onceki[i]); fark /= g.length; }
    canli.onceki = g;
    return fark;
  }

  // Kamera en az 0,6 sn sabit kalana kadar bekle (bulanik ve kaymis kare olculmez)
  async function sabitBekle() {
    let sakin = 0;
    const bas = performance.now();
    while (canli.akis) {
      const f = hareket();
      sakin = f < 2.5 ? sakin + 1 : 0;
      if (sakin >= 6) return true;
      canli.yazi.textContent = performance.now() - bas > 1500 ? "Kamerayı sabit tutun…" : "Bekleniyor…";
      await new Promise(r => setTimeout(r, 100));
    }
    return false;
  }

  async function kareOlc() {
    if (!canli.akis || canli.mesgul) return;
    canli.mesgul = true;
    try {
      if (!(await sabitBekle())) return;
      canli.yazi.textContent = `Ölçülüyor… (${canli.video.videoWidth}×${canli.video.videoHeight})`;
      const v = canli.video, c = document.createElement("canvas");
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0);
      const kare = await new Promise(r => c.toBlob(r, "image/jpeg", 0.95));
      const sonuc = await istek("/api/olc", olcumFormu(new File([kare], "kare.jpg", { type: "image/jpeg" })));
      // Olcum surerken kamera oynadiysa sonuc o anki goruntuye uymaz: at
      if (hareket() > 6) { canli.yazi.textContent = "Ölçüm sırasında kamera oynadı, tekrar…"; return; }
      ortancaEkle(sonuc);
      sonOlcum = sonuc; sonFoto = kare; hata(""); sonucYaz(); canliCiz(sonuc);
      const n = sonuc.parcalar.filter(p => p.guvenilir).length;
      canli.yazi.textContent = !n ? "Parça bulunamadı" : (sonuc.uyarilar && sonuc.uyarilar.length ? `${n} parça, ölçüm sapabilir` : `${n} parça ölçüldü`);
    } catch (e) {
      if (canli.svg) canli.svg.replaceChildren();
      if (canli.yazi) canli.yazi.textContent = e.message.length > 80 ? e.message.slice(0, 80) + "…" : e.message;
    } finally {
      canli.mesgul = false;
      if (canli.akis && $("surekli").checked) canli.zamanlayici = setTimeout(kareOlc, 300);
    }
  }

  // Son olcumlerin ortancasi: en buyuk guvenilir parcanin iki kenari (tek kare oynamasini bastirir)
  function ortancaEkle(s) {
    const p = s.parcalar.filter(q => q.guvenilir && q.koseler.length === 4)[0];
    if (!p) return;
    const a = (p.kenarlar[0] + p.kenarlar[2]) / 2, b = (p.kenarlar[1] + p.kenarlar[3]) / 2;
    const l = canli.gecmis || (canli.gecmis = []);
    // Parca degistiyse (boyut %15'ten fazla farkli) gecmisi sifirla
    if (l.length && Math.abs(l[l.length - 1].a - a) > 0.15 * a) l.length = 0;
    l.push({ a, b }); if (l.length > 7) l.shift();
    const med = v => { const t = [...v].sort((x, y) => x - y); return t[Math.floor(t.length / 2)]; };
    const A = l.map(x => x.a), B = l.map(x => x.b);
    if (l.length >= 3) s.canliOrtanca = { n: l.length, a: med(A), b: med(B), yayilim: Math.max(Math.max(...A) - Math.min(...A), Math.max(...B) - Math.min(...B)) / 2 };
  }

  // Bulunan tabla ve parcalari canli goruntunun ustune ciz (tabla mm -> goruntu pikseli)
  function canliCiz(s) {
    if (!canli.svg) return;
    const svg = canli.svg; svg.replaceChildren();
    const { w, h } = s.goruntuBoyutu; svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const b = Math.max(w, h) / 100, L = s.tabla.uzunluk, W = s.tabla.genislik, k = s.tablaKoseleri;
    svg.append(el("polygon", { class: "cerceve", points: k.map(p => p.join(",")).join(" "), "stroke-width": b * 0.25 }));
    const H = homografi([[0, 0], [0, W], [L, W], [L, 0]], k);
    s.parcalar.filter(p => p.guvenilir).forEach(p => {
      const pts = p.koseler.map(H);
      svg.append(el("polygon", { class: "canli-parca", points: pts.map(q => q.join(",")).join(" "), "stroke-width": b * 0.35 }));
      const dortgen = p.koseler.length === 4;
      const yazi = dortgen ? `${sayi((p.kenarlar[0] + p.kenarlar[2]) / 2)} × ${sayi((p.kenarlar[1] + p.kenarlar[3]) / 2)} mm` : `${sayi(p.alanCm2 / 10000, 2)} m²`;
      const cx = pts.reduce((a, q) => a + q[0], 0) / pts.length, cy = pts.reduce((a, q) => a + q[1], 0) / pts.length;
      const gen = yazi.length * b * 1.15 + b * 1.6, yuk = b * 3;
      const g = el("g", { class: "canli-etiket" }, el("rect", { x: cx - gen / 2, y: cy - yuk / 2, width: gen, height: yuk, rx: b * 0.3 }));
      const t = el("text", { x: cx, y: cy + b * 0.8, "text-anchor": "middle", "font-size": b * 2.2 }); t.textContent = yazi;
      g.append(t); svg.append(g);
    });
  }

  $("canliDugme").onclick = () => canli.akis ? kamerayiKapat() : kamerayiAc();
  $("kareDugme").onclick = () => kareOlc();
  $("surekli").onchange = () => { if ($("surekli").checked) kareOlc(); };
  window.addEventListener("resize", yerlestirSvg);

  // Tabla olcusu ve tercihler tarayicida hatirlanir (masa ya da ahsap tabla bir kez girilir)
  const AYAR = ["uzunluk", "genislik", "tekrenk"];
  try {
    const a = JSON.parse(localStorage.getItem("kopruKesimAyar") || "{}");
    AYAR.forEach(id => { if (a[id] === undefined) return; const e = $(id); if (e.type === "checkbox") e.checked = a[id]; else e.value = a[id]; });
  } catch (e) { /* tarayici depolamasi kapali olabilir */ }
  const ayarKaydet = () => {
    try { const a = {}; AYAR.forEach(id => { const e = $(id); a[id] = e.type === "checkbox" ? e.checked : e.value; }); localStorage.setItem("kopruKesimAyar", JSON.stringify(a)); } catch (e) { }
  };
  AYAR.forEach(id => $(id).addEventListener("change", () => { ayarKaydet(); durumYaz(); }));
  let kayitliMod = "tek";
  try { kayitliMod = localStorage.getItem("kopruKesimMod") || "tek"; } catch (e) { }
  modUygula(["tek", "kurulum", "isaret"].includes(kayitliMod) ? kayitliMod : "tek", false);
  istek("/api/durum").then(d => { durum = d; ciz(); }).catch(e => { hata(e.message); durumYaz(); });
})();
</script>
